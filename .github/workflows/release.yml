name: Build and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build
        run: npm run build

      - name: Validate
        run: npm test

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          rm -rf release stage-portable stage-windows
          mkdir -p release stage-portable stage-windows

          cp -a dist/. stage-portable/
          cp README.md USER-GUIDE.md LICENSE stage-portable/
          (cd stage-portable && zip -qr "../release/Interactive-controller-Portable-${TAG}.zip" .)

          cp -a dist/. stage-windows/
          cp README.md USER-GUIDE.md LICENSE stage-windows/
          (cd stage-windows && zip -qr "../release/Interactive-controller-Windows-x64-${TAG}.zip" .)

          (
            cd release
            sha256sum *.zip > "Interactive-controller-${TAG}-SHA256.txt"
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --verify-tag \
            --title "Interactive-controller ${GITHUB_REF_NAME}" \
            --generate-notes
